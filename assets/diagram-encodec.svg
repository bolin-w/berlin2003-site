  <rect x="366" y="432" width="188" height="74" rx="20" fill="#22778F"/>
  <text x="460" y="460" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial, sans-serif">Loss Balancer</text>
  <text x="460" y="484" text-anchor="middle" fill="#E8F8F6" font-size="13" font-family="Arial, sans-serif">controls gradient contribution</text>

  <text x="52" y="522" fill="#6F685D" font-size="13" font-family="Arial, sans-serif">one clean codec backbone, one discriminator, and a better way to balance reconstruction, perceptual and adversarial objectives</text>
