  <text x="712" y="460" text-anchor="middle" fill="#191611" font-size="18" font-family="Arial, sans-serif">MS-STFT Disc</text>
  <text x="712" y="484" text-anchor="middle" fill="#6F685D" font-size="13" font-family="Arial, sans-serif">single multi-scale discriminator</text>
