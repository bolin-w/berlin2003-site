  <rect x="434" y="312" width="78" height="28" rx="10" fill="#FFFFFF" stroke="#CFD8E0"/>
  <text x="473" y="293" text-anchor="middle" fill="#191611" font-size="15" font-family="Arial, sans-serif">codes</text>
