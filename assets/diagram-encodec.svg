  <text x="274" y="302" text-anchor="middle" fill="#6F685D" font-size="14" font-family="Arial, sans-serif">streaming for speech</text>
  <text x="274" y="326" text-anchor="middle" fill="#6F685D" font-size="14" font-family="Arial, sans-serif">stronger temporal modeling</text>

