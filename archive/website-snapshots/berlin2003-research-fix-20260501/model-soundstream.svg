<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SoundStream model structure</title>
  <desc id="desc">Redrawn architecture diagram based on the paper structure.</desc>
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFEFF"/>
      <stop offset="0.62" stop-color="#F0FAFA"/>
      <stop offset="1" stop-color="#FFF8F3"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B3C5D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowInk" markerWidth="16" markerHeight="16" refX="10" refY="8" orient="auto">
      <path d="M2 2L12 8L2 14" fill="none" stroke="#07162F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" refX="10" refY="8" orient="auto">
      <path d="M2 2L12 8L2 14" fill="none" stroke="#0D999D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOrange" markerWidth="16" markerHeight="16" refX="10" refY="8" orient="auto">
      <path d="M2 2L12 8L2 14" fill="none" stroke="#F26419" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .bg{fill:url(#paperBg)}
    .grid{stroke:#D9EDF7;stroke-width:1;opacity:.75}
    .title{font:850 34px "Aptos Display","Segoe UI",sans-serif;fill:#07162F}
    .kicker{font:800 15px "Aptos","Segoe UI",sans-serif;fill:#0D999D;text-transform:uppercase}
    .footer{font:750 13px "Aptos","Segoe UI",sans-serif;fill:#5A6C84}
    .node,.mini,.token{fill:#FFFFFF;stroke-width:2;filter:url(#softShadow)}
    .node.blue,.mini.blue,.token.blue{stroke:#1264E8}
    .node.teal,.mini.teal,.token.teal{stroke:#0D999D}
    .node.orange,.mini.orange,.token.orange{stroke:#F26419}
    .node.ink,.mini.ink,.token.ink{stroke:#07162F}
    .node-label{font:850 21px "Aptos Display","Segoe UI",sans-serif;fill:#07162F}
    .node-sub{font:700 14px "Aptos","Segoe UI",sans-serif;fill:#53647D}
    .mini-label{font:800 13px "Aptos","Segoe UI",sans-serif;fill:#07162F}
    .token-label{font:850 13px "Aptos","Segoe UI",sans-serif;fill:#07162F}
    .group{fill:rgba(255,255,255,.62);stroke:#9DB9D3;stroke-width:1.7;stroke-dasharray:8 8}
    .group-label{font:850 15px "Aptos","Segoe UI",sans-serif;fill:#53647D}
    .label{font:850 18px "Aptos","Segoe UI",sans-serif;fill:#07162F}
    .sub{font:700 14px "Aptos","Segoe UI",sans-serif;fill:#53647D}
    .arrow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .arrow.ink{stroke:#07162F;marker-end:url(#arrowInk)}
    .arrow.teal{stroke:#0D999D;marker-end:url(#arrowTeal)}
    .arrow.orange{stroke:#F26419;marker-end:url(#arrowOrange)}
    .line{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .line.muted{stroke:#9DB0C5;stroke-dasharray:6 7}
    .line.orange{stroke:#F26419;stroke-dasharray:7 7}
    .wave path{fill:none;stroke-width:4;stroke-linecap:round}
    .wave.teal path{stroke:#0D999D}
    .wave.blue path{stroke:#1264E8}
    .wave.orange path{stroke:#F26419}
  </style>
  <rect width="1280" height="720" rx="0" class="bg"/>
  <path d="M80 0V720" class="grid"/><path d="M160 0V720" class="grid"/><path d="M240 0V720" class="grid"/><path d="M320 0V720" class="grid"/><path d="M400 0V720" class="grid"/><path d="M480 0V720" class="grid"/><path d="M560 0V720" class="grid"/><path d="M640 0V720" class="grid"/><path d="M720 0V720" class="grid"/><path d="M800 0V720" class="grid"/><path d="M880 0V720" class="grid"/><path d="M960 0V720" class="grid"/><path d="M1040 0V720" class="grid"/><path d="M1120 0V720" class="grid"/><path d="M1200 0V720" class="grid"/>
  <path d="M0 80H1280" class="grid"/><path d="M0 160H1280" class="grid"/><path d="M0 240H1280" class="grid"/><path d="M0 320H1280" class="grid"/><path d="M0 400H1280" class="grid"/><path d="M0 480H1280" class="grid"/><path d="M0 560H1280" class="grid"/><path d="M0 640H1280" class="grid"/>
  <text x="54" y="62" class="title" text-anchor="start">SoundStream</text>
  <text x="54" y="94" class="kicker" text-anchor="start">Streaming neural audio codec / RVQ / multi-bitrate</text>
  
      <g class="wave teal" transform="translate(58 313)">
    <path d="M0 28 C12 -8 24 64 36 28 C48 -8 60 64 72 28 C84 -8 96 64 108 28"/>
  </g>
      <text x="64" y="405" class="sub" text-anchor="start">waveform</text>
      <path d="M176 342 L226 342" class="arrow ink"/>
      <g>
    <rect x="230" y="294" width="176" height="96" rx="18" class="node blue"/>
    <text x="318" y="330" class="node-label" text-anchor="middle">Causal Encoder</text>
    <text x="318" y="352" class="node-sub"><tspan x="318" dy="0">strided conv</tspan><tspan x="318" dy="20">low latency</tspan></text>
  </g>
      <path d="M406 342 L462 342" class="arrow ink"/>
      <g>
    <rect x="462" y="214" width="250" height="250" rx="28" class="group"/>
    <text x="486" y="248" class="group-label" text-anchor="start">Residual vector quantization</text>
  </g>
      <g>
    <rect x="512" y="280" width="76" height="28" rx="8" class="token teal"/>
    <text x="550" y="300" class="token-label" text-anchor="middle">Q1</text>
    <rect x="512" y="318" width="76" height="28" rx="8" class="token teal"/>
    <text x="550" y="338" class="token-label" text-anchor="middle">Q2</text>
    <rect x="512" y="356" width="76" height="28" rx="8" class="token teal"/>
    <text x="550" y="376" class="token-label" text-anchor="middle">Q3</text>
    <rect x="512" y="394" width="76" height="28" rx="8" class="token teal"/>
    <text x="550" y="414" class="token-label" text-anchor="middle">Qn</text>
  </g>
      <g>
    <rect x="608" y="278" width="70" height="34" rx="12" class="mini orange"/>
    <text x="643" y="301" class="mini-label" text-anchor="middle">dropout</text>
  </g>
      <g>
    <rect x="608" y="322" width="70" height="34" rx="12" class="mini blue"/>
    <text x="643" y="345" class="mini-label" text-anchor="middle">rate</text>
  </g>
      <g>
    <rect x="608" y="366" width="70" height="34" rx="12" class="mini teal"/>
    <text x="643" y="389" class="mini-label" text-anchor="middle">layers</text>
  </g>
      <path d="M712 342 L770 342" class="arrow ink"/>
      <g>
    <rect x="774" y="294" width="176" height="96" rx="18" class="node blue"/>
    <text x="862" y="330" class="node-label" text-anchor="middle">Causal Decoder</text>
    <text x="862" y="352" class="node-sub"><tspan x="862" dy="0">reconstruct</tspan><tspan x="862" dy="20">streamable</tspan></text>
  </g>
      <path d="M950 342 L1010 342" class="arrow ink"/>
      <g class="wave blue" transform="translate(1028 313)">
    <path d="M0 28 C12 -8 24 64 36 28 C48 -8 60 64 72 28 C84 -8 96 64 108 28"/>
  </g>
      <text x="1038" y="405" class="sub" text-anchor="start">audio out</text>
      <path d="M850 294 C850 206 724 190 706 144" class="arrow orange"/>
      <g>
    <rect x="620" y="116" width="188" height="72" rx="18" class="node orange"/>
    <text x="714" y="152" class="node-label" text-anchor="middle">Discriminator</text>
    <text x="714" y="174" class="node-sub"><tspan x="714" dy="0">perceptual loss</tspan></text>
  </g>
      <path d="M586 464 C558 520 438 520 392 464" class="line muted"/>
      <g>
    <rect x="410" y="518" width="150" height="32" rx="12" class="mini teal"/>
    <text x="485" y="540" class="mini-label" text-anchor="middle">token stream</text>
  </g>
      <g>
    <rect x="588" y="518" width="138" height="32" rx="12" class="mini blue"/>
    <text x="657" y="540" class="mini-label" text-anchor="middle">receiver</text>
  </g>
      <path d="M560 534 L588 534" class="arrow teal"/>
    
  <text x="54" y="676" class="footer" text-anchor="start">REDRAWN MODEL STRUCTURE</text>
  <text x="1226" y="676" class="footer" text-anchor="end">encoder -&gt; RVQ -&gt; decoder</text>
</svg>
