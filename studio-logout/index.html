<body>
  <div class="site-shell">
    <header class="module-top">
      <a class="backlink" href="/">← 首页</a>
      <span>logout / basic auth</span>
    </header>

    <main class="module-main">
      <h1>退出工作台</h1>
      <p class="module-intro">工作台使用浏览器 Basic Auth。它不是普通网页登录，浏览器会缓存账号密码，所以网页不能保证一键清除登录态。</p>

      <section class="studio-panel logout-panel">
        <h2>怎么退出</h2>
        <p>最可靠的方法是关闭当前浏览器窗口，或清除 berlin2003.ccwu.cc 的站点登录信息。</p>
        <div class="meta-row">
          <a class="meta-chip studio-link-chip" href="/">返回首页</a>
          <a class="meta-chip studio-link-chip" href="/studio/">重新进入工作台</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>工作台退出</span>
      <span>Basic Auth</span>
    </footer>
  </div>
