<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 放映室</title>
  <meta name="description" content="Berlin2003 的私密放映室：本地压好字幕后上传，网页负责整理和播放。">
  <meta name="theme-color" content="#f7fbff">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/section-lab.css?v=20260505-polish">
</head>
<body class="anime-page section-lab-body anime-lab-body">
  <div class="site-shell section-lab-shell">
    <header class="section-lab-topbar">
      <a class="section-lab-brand" href="/" aria-label="Berlin2003 首页"><span>Berlin</span><strong>2003</strong></a>
      <nav class="section-lab-nav" aria-label="视频库导航">
        <a href="/projects/">项目</a>
        <a href="/notes/">笔记</a>
        <a href="/studio/anime/">片库后台</a>
        <a href="/contact/">联系</a>
      </nav>
    </header>

    <main class="section-lab-main anime-main">
      <section class="section-lab-hero">
        <div class="section-lab-copy">
          <p class="section-lab-kicker">私人放映</p>
          <h1>有字幕的夜场</h1>
          <p class="section-lab-lead">那些已经配好中文字幕的影像，安静陈列于此。此页只负责收藏与放映，不涉搜索、下载或转码。</p>
          <div class="section-lab-actions">
            <a class="section-lab-primary" href="/studio/anime/">整理片架</a>
            <a href="/projects/">返回项目</a>
          </div>
        </div>
        <div class="section-lab-visual anime-screen-visual">
          <img class="anime-screen-image" src="/assets/anime-screening-room.png" alt="带中文字幕的私人放映室">
          <div class="section-lab-visual-note">
            <strong>片架状态</strong>
            <span id="anime-status">正在点亮片架...</span>
          </div>
        </div>
      </section>

      <section class="anime-layout video-layout">
        <div class="anime-panel">
          <div class="anime-panel-head">
            <h2>片架</h2>
            <span id="anime-count">0 部片子</span>
          </div>
          <div class="anime-grid" id="video-list"></div>
        </div>

        <div class="anime-panel anime-detail" id="video-detail">
          <div class="anime-empty">
            <span>银幕</span>
            <p>从片架取一部，银幕便在此处展开。</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="section-lab-footer">
      <span>放映室</span>
      <span>中文字幕 / 私人放映</span>
    </footer>
  </div>

  <script src="/assets/anime.js?v=20260505-polish"></script>
</body>
</html>
