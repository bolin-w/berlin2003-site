<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 视频上传后台</title>
  <meta name="theme-color" content="#f4efe6">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="site-shell">
    <header class="module-top">
      <nav class="module-nav" aria-label="后台导航">
        <a class="backlink" href="/">← 首页</a>
        <a class="backlink" href="/anime/">视频库</a>
        <a class="backlink" href="/studio/">工作台</a>
      </nav>
      <span>video admin / private</span>
    </header>

    <main class="module-main">
      <h1>视频上传</h1>
      <p class="module-intro">先在本地把字幕压进 MP4，再上传到这里。服务器只做存储和播放，不做种子下载、自动字幕或转码。</p>

      <section class="anime-admin-status studio-status">
        <span class="status-dot" id="anime-admin-dot"></span>
        <span id="anime-admin-status">正在检查视频服务...</span>
      </section>

      <div class="anime-admin-grid video-admin-grid">
        <section class="studio-panel">
          <h2>上传视频</h2>
          <form class="studio-form" id="video-upload-form">
            <label>
              标题
              <input name="title" placeholder="例如：Psych2Go 中文字幕版" required>
            </label>
            <label>
              Slug
              <input name="slug" placeholder="可选，例如 psych2go-subbed">
            </label>
            <label>
              简介
              <textarea name="description" placeholder="可选，写来源、版本或备注。"></textarea>
            </label>
            <label>
              封面 URL
              <input name="posterUrl" placeholder="可选">
            </label>
            <label>
              已压字幕 MP4
              <input name="file" type="file" accept="video/mp4" required>
            </label>
            <button class="submit-button" type="submit">上传并发布</button>
          </form>
        </section>

        <section class="studio-result">
          <div class="studio-result-head">
            <h2>已上传</h2>
            <button class="copy-button" id="video-refresh" type="button">刷新</button>
          </div>
          <div class="anime-admin-list" id="video-admin-list"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <span>视频后台</span>
      <span>Basic Auth</span>
    </footer>
  </div>

  <script src="/assets/anime-admin.js"></script>
</body>
</html>
