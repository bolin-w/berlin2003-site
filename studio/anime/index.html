<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 片库后台</title>
  <meta name="theme-color" content="#f4efe6">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/section-lab.css?v=20260505-polish">
</head>
<body class="section-lab-body anime-lab-body">
  <div class="site-shell section-lab-shell">
    <header class="section-lab-topbar">
      <a class="section-lab-brand" href="/" aria-label="Berlin2003 首页"><span>Berlin</span><strong>2003</strong></a>
      <nav class="section-lab-nav" aria-label="后台导航">
        <a href="/anime/">视频库</a>
        <a href="/studio/">工作台</a>
        <a href="/life/">生活</a>
        <a href="/studio-logout/">退出</a>
      </nav>
    </header>

    <main class="section-lab-main">
      <section class="section-lab-hero">
        <div class="section-lab-copy">
          <p class="section-lab-kicker">Screening Admin</p>
          <h1>把片子放进放映室。</h1>
          <p class="section-lab-lead">先在本地把字幕压进 MP4，再上传到这里。服务器只保存片源、片单和播放地址，不接管字幕制作，也不做转码。</p>
          <div class="section-lab-actions">
            <a class="section-lab-primary" href="/anime/">打开放映室</a>
            <a href="/studio/">返回工作台</a>
          </div>
        </div>
        <div class="section-lab-visual anime-screen-visual">
          <div class="anime-screen-mark">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="section-lab-visual-note">
            <strong>Local subtitle, server shelf</strong>
            <span>本地处理字幕，服务器只把成片收进片库。</span>
          </div>
        </div>
      </section>

      <section class="anime-admin-status studio-status">
        <span class="status-dot" id="anime-admin-dot"></span>
        <span id="anime-admin-status">正在确认片库是否在线...</span>
      </section>

      <div class="anime-admin-grid video-admin-grid">
        <section class="studio-panel">
          <h2>添一部片子</h2>
          <form class="studio-form" id="video-upload-form">
            <label>
              标题
              <input name="title" placeholder="例如：某一集 中文字幕版" required>
            </label>
            <label>
              Slug
              <input name="slug" placeholder="可选，例如 psych2go-subbed">
            </label>
            <label>
              简介
              <textarea name="description" placeholder="可选，写来源、版本、字幕或观看备注。"></textarea>
            </label>
            <label>
              封面 URL
              <input name="posterUrl" placeholder="可选">
            </label>
            <label>
              已压好字幕的 MP4
              <input name="file" type="file" accept="video/mp4" required>
            </label>
            <button class="submit-button" type="submit">放进片库</button>
          </form>
        </section>

        <section class="studio-result">
          <div class="studio-result-head">
            <h2>片库里已有</h2>
            <button class="copy-button" id="video-refresh" type="button">重新整理</button>
          </div>
          <div class="anime-admin-list" id="video-admin-list"></div>
        </section>
      </div>
    </main>

    <footer class="section-lab-footer">
      <span>片库后台</span>
      <span>Basic Auth</span>
    </footer>
  </div>

  <script src="/assets/anime-admin.js?v=20260505-polish"></script>
</body>
</html>
