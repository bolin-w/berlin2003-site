<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 工作台</title>
  <meta name="theme-color" content="#f4efe6">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/section-lab.css?v=20260505-polish">
</head>
<body class="section-lab-body anime-lab-body">
  <div class="site-shell section-lab-shell">
    <header class="section-lab-topbar">
      <a class="section-lab-brand" href="/" aria-label="Berlin2003 首页"><span>Berlin</span><strong>2003</strong></a>
      <nav class="section-lab-nav" aria-label="工作台导航">
        <a href="/studio/anime/">片库后台</a>
        <a href="/studio/notion/">Notion</a>
        <a href="/life/">日记</a>
        <a href="/notes/">笔记</a>
        <a href="/studio-logout/">退出</a>
      </nav>
    </header>

    <main class="section-lab-main">
      <section class="section-lab-hero">
        <div class="section-lab-copy">
          <p class="section-lab-kicker">文字书房</p>
          <h1>未定稿之所</h1>
          <p class="section-lab-lead">摘记、段落与未成形的想法，先在此处停笔。削繁、理脉、取其骨架，再送往正式页面。</p>
          <div class="section-lab-actions">
            <a class="section-lab-primary" href="/studio/anime/">整理片库</a>
            <a href="/studio-logout/">离开工作台</a>
          </div>
        </div>
        <div class="section-lab-visual">
          <div class="section-lab-visual-note">
            <strong>案上草稿</strong>
            <span>为 research 文案、阶段笔记与长文本摘要预留的私有书桌。</span>
          </div>
        </div>
      </section>

      <div class="meta-row">
        <a class="meta-chip studio-link-chip" href="/studio/notion/">Notion 笔记导入</a>
        <a class="meta-chip studio-link-chip" href="/studio/anime/">片库后台</a>
        <a class="meta-chip studio-link-chip" href="/studio-logout/">离开工作台</a>
      </div>

      <div class="studio-shell">
        <section class="studio-panel">
          <h2>原稿</h2>
          <div class="studio-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">正在看看工作台醒了没有...</span>
          </div>

          <div class="preset-row">
            <button class="preset-button" type="button" data-preset="homepage">首页片段</button>
            <button class="preset-button" type="button" data-preset="module">拆成模块</button>
            <button class="preset-button" type="button" data-preset="notes">整理笔记</button>
            <button class="preset-button" type="button" data-preset="refine">顺一遍</button>
          </div>

          <form class="studio-form" id="studio-form">
            <div class="studio-row">
              <label>
                处理模式
                <select id="mode" name="mode">
                  <option value="rewrite">改写</option>
                  <option value="structure">整理结构</option>
                  <option value="summarize">压缩摘要</option>
                </select>
              </label>
              <label>
                修订方向
                <input id="instruction" name="instruction" placeholder="例如：凝成页面摘要，保留事实与原本语气。">
              </label>
            </div>

            <label>
              原文
              <textarea id="content" name="content" placeholder="粘贴尚未定稿的文字。"></textarea>
            </label>

            <button class="submit-button" type="submit">修订文字</button>
          </form>
        </section>

        <section class="studio-result">
          <div class="studio-result-head">
            <h2>修订稿</h2>
            <button class="copy-button" id="copy-output" type="button">复制稿件</button>
          </div>
          <pre id="result" class="result-placeholder">修订后的文字会显示在这里。</pre>
        </section>
      </div>
    </main>

    <footer class="section-lab-footer">
      <span>工作台</span>
      <span>私有书房 / 草稿修订</span>
    </footer>
  </div>

  <script src="/assets/studio.js?v=20260505-polish"></script>
</body>
</html>
