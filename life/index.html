<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 日记</title>
  <meta name="description" content="Berlin2003 的私密日记页，支持写入、编辑、删除，并按时间展示成卡片。">
  <meta name="theme-color" content="#f7fbff">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/section-lab.css?v=20260505-diary">
</head>
<body class="section-lab-body life-diary-body">
  <div class="site-shell section-lab-shell">
    <header class="section-lab-topbar">
      <a class="section-lab-brand" href="/" aria-label="Berlin2003 首页"><span>Berlin</span><strong>2003</strong></a>
      <nav class="section-lab-nav" aria-label="日记导航">
        <a href="/studio/">工作台</a>
        <a href="/notes/">笔记</a>
        <a href="/contact/">联系</a>
        <a href="/studio-logout/">退出</a>
      </nav>
    </header>

    <main class="section-lab-main">
      <section class="section-lab-hero life-diary-hero" aria-labelledby="life-title">
        <div class="section-lab-copy">
          <p class="section-lab-kicker">私人日记</p>
          <h1 id="life-title">浮生日笺</h1>
          <p class="section-lab-lead">把一日的光影、天气与心绪收作短笺。来日重读，不求成篇，只为留住当时的声息。</p>
          <figure class="life-diary-hero-image">
            <img src="/assets/life-diary-room.png" alt="私人日记与生活片段的视觉插图">
          </figure>
          <div class="section-lab-chips">
            <span class="section-lab-chip">私有访问</span>
            <span class="section-lab-chip">服务器保存</span>
            <span class="section-lab-chip">卡片可编辑</span>
          </div>
        </div>

        <section class="life-diary-editor" aria-label="写日记">
          <div class="life-diary-editor-head">
            <div>
              <span>写新日记</span>
              <h2>记今日</h2>
            </div>
            <strong id="diary-status">日记本正在翻页...</strong>
          </div>

          <form id="life-diary-form" class="life-diary-form">
            <div class="life-diary-row">
              <label>
                标题
                <input id="diary-title" name="title" maxlength="80" placeholder="给这一日题名">
              </label>
              <label>
                心情
                <input id="diary-mood" name="mood" maxlength="40" placeholder="天气、心绪或一瞬状态">
              </label>
            </div>

            <label>
              标签
              <input id="diary-tags" name="tags" maxlength="120" placeholder="索引词，例如：生活, 学习, 网站">
            </label>

            <label>
              内容
              <textarea id="diary-content" name="content" required placeholder="写下此刻仍值得留下的几行。"></textarea>
            </label>

            <div class="life-diary-emoji" aria-label="添加表情">
              <span>表情</span>
              <button type="button" data-emoji="🙂">🙂</button>
              <button type="button" data-emoji="😄">😄</button>
              <button type="button" data-emoji="🥲">🥲</button>
              <button type="button" data-emoji="😴">😴</button>
              <button type="button" data-emoji="🍜">🍜</button>
              <button type="button" data-emoji="📚">📚</button>
              <button type="button" data-emoji="💻">💻</button>
              <button type="button" data-emoji="✨">✨</button>
            </div>

            <section class="life-photo-drop" id="life-photo-drop" aria-label="上传照片">
              <input id="diary-photos" type="file" accept="image/*" multiple>
              <div>
                <strong>今日影像</strong>
                <span>拖入图片，或点击选择。最多 6 张，会先压缩再归入日笺。</span>
              </div>
            </section>

            <div class="life-photo-preview" id="life-photo-preview" aria-label="照片预览"></div>

            <div class="life-diary-actions">
              <button id="diary-submit" type="submit">收进时间线</button>
              <button id="diary-reset" type="button" hidden>不改了</button>
            </div>
          </form>
        </section>
      </section>

      <section class="life-diary-board" aria-label="日记卡片">
        <div class="life-diary-board-head">
          <div>
            <span>日记卡片</span>
            <h2>旧日留痕</h2>
          </div>
          <strong id="diary-count">0 条记录</strong>
        </div>
        <div id="diary-list" class="life-diary-list"></div>
      </section>
    </main>

    <footer class="section-lab-footer">
      <span>生活日记</span>
      <span>私有访问 / 可编辑</span>
    </footer>
  </div>

  <script src="/assets/life-diary.js?v=20260505"></script>
</body>
</html>
