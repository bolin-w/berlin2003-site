<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 生活</title>
  <meta name="theme-color" content="#0b100f">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="site-shell">
    <header class="module-top">
      <a class="backlink" href="/">← Home</a>
      <span>Life / Private</span>
    </header>

    <main class="module-main">
      <h1>生活</h1>
      <p class="module-intro">这里留给你放生活相关的东西，比如照片、记录、想法、私人书签和只想给少数人看的页面。这个区域现在已经加了访问控制，未授权的人进不来。</p>

      <div class="meta-row">
        <span class="meta-chip">Private</span>
        <span class="meta-chip">Photos</span>
        <span class="meta-chip">Notes</span>
        <span class="meta-chip">Personal</span>
      </div>

      <section class="module-grid">
        <article class="module-card">
          <span>区块 01</span>
          <strong>生活记录</strong>
          <p>可以放时间线、近况、想保存但不想公开的内容。</p>
        </article>
        <article class="module-card">
          <span>区块 02</span>
          <strong>图片与收藏</strong>
          <p>后面可以接照片、截图、片段或你自己的分类收藏页。</p>
        </article>
        <article class="module-card">
          <span>区块 03</span>
          <strong>只给特定人看</strong>
          <p>把账号密码发给允许访问的人，他们才能进入这个模块。</p>
        </article>
      </section>
    </main>

    <footer class="footer">
      <span>Life / Private</span>
      <span>Restricted</span>
    </footer>
  </div>

  <script src="/assets/site-ai.js"></script>
</body>
</html>
