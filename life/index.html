<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 日记</title>
  <meta name="description" content="Berlin2003 的私密日记页，支持写入、编辑、删除，并按时间展示成卡片。">
  <meta name="theme-color" content="#f7fbff">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/section-lab.css?v=20260505-diary">
</head>
<body class="section-lab-body life-diary-body">
  <div class="site-shell section-lab-shell">
    <header class="section-lab-topbar">
      <a class="section-lab-brand" href="/" aria-label="Berlin2003 首页"><span>Berlin</span><strong>2003</strong></a>
      <nav class="section-lab-nav" aria-label="日记导航">
        <a href="/studio/">工作台</a>
        <a href="/notes/">笔记</a>
        <a href="/contact/">联系</a>
        <a href="/studio-logout/">退出</a>
      </nav>
    </header>

    <main class="section-lab-main">
      <section class="section-lab-hero life-diary-hero" aria-labelledby="life-title">
        <div class="section-lab-copy">
          <p class="section-lab-kicker">Private Diary</p>
          <h1 id="life-title">写一次，留下一张卡片。</h1>
          <p class="section-lab-lead">这里是真正可用的私密日记。每次写完保存，页面会按时间生成卡片；可以拖拽照片、点表情、编辑旧记录，也可以删除。</p>
          <div class="section-lab-chips">
            <span class="section-lab-chip">Basic Auth</span>
            <span class="section-lab-chip">Server saved</span>
            <span class="section-lab-chip">Editable cards</span>
          </div>
        </div>

        <section class="life-diary-editor" aria-label="写日记">
          <div class="life-diary-editor-head">
            <div>
              <span>New entry</span>
              <h2>今天记录什么？</h2>
            </div>
            <strong id="diary-status">正在准备日记...</strong>
          </div>

          <form id="life-diary-form" class="life-diary-form">
            <div class="life-diary-row">
              <label>
                标题
                <input id="diary-title" name="title" maxlength="80" placeholder="例如：今天把网站改顺了">
              </label>
              <label>
                心情
                <input id="diary-mood" name="mood" maxlength="40" placeholder="例如：平静 / 累 / 开心">
              </label>
            </div>

            <label>
              标签
              <input id="diary-tags" name="tags" maxlength="120" placeholder="用逗号分隔，例如：生活, 学习, 网站">
            </label>

            <label>
              内容
              <textarea id="diary-content" name="content" required placeholder="写下今天发生了什么、想了什么、完成了什么。"></textarea>
            </label>

            <div class="life-diary-emoji" aria-label="添加表情">
              <span>表情</span>
              <button type="button" data-emoji="🙂">🙂</button>
              <button type="button" data-emoji="😄">😄</button>
              <button type="button" data-emoji="🥲">🥲</button>
              <button type="button" data-emoji="😴">😴</button>
              <button type="button" data-emoji="🍜">🍜</button>
              <button type="button" data-emoji="📚">📚</button>
              <button type="button" data-emoji="💻">💻</button>
              <button type="button" data-emoji="✨">✨</button>
            </div>

            <section class="life-photo-drop" id="life-photo-drop" aria-label="上传照片">
              <input id="diary-photos" type="file" accept="image/*" multiple>
              <div>
                <strong>拖拽照片到这里</strong>
                <span>也可以点击选择图片。每篇最多 6 张，保存前会自动压缩。</span>
              </div>
            </section>

            <div class="life-photo-preview" id="life-photo-preview" aria-label="照片预览"></div>

            <div class="life-diary-actions">
              <button id="diary-submit" type="submit">记下这一篇</button>
              <button id="diary-reset" type="button" hidden>取消编辑</button>
            </div>
          </form>
        </section>
      </section>

      <section class="life-diary-board" aria-label="日记卡片">
        <div class="life-diary-board-head">
          <div>
            <span>Diary cards</span>
            <h2>时间线</h2>
          </div>
          <strong id="diary-count">0 entries</strong>
        </div>
        <div id="diary-list" class="life-diary-list"></div>
      </section>
    </main>

    <footer class="section-lab-footer">
      <span>Life / Diary</span>
      <span>restricted / editable</span>
    </footer>
  </div>

  <script src="/assets/life-diary.js?v=20260505"></script>
</body>
</html>
