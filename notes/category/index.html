<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin2003 / 笔记分类</title>
  <meta name="description" content="Berlin2003 的笔记分类页，按札记与项目记录查看导入文章。">
  <meta name="theme-color" content="#f7fbff">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/section-lab.css?v=20260505-polish">
</head>
<body class="section-lab-body">
  <div class="site-shell section-lab-shell">
    <header class="section-lab-topbar">
      <a class="section-lab-brand" href="/" aria-label="Berlin2003 首页"><span>Berlin</span><strong>2003</strong></a>
      <nav class="section-lab-nav" aria-label="笔记导航">
        <a href="/notes/">笔记</a>
        <a href="/research/">研究</a>
        <a href="/projects/">项目</a>
        <a href="/contact/">联系</a>
      </nav>
    </header>

    <main class="section-lab-main">
      <section class="section-lab-hero" aria-labelledby="category-title">
        <div class="section-lab-copy">
          <p class="section-lab-kicker" id="category-kicker">札记</p>
          <h1 id="category-title">加载中...</h1>
          <p class="section-lab-lead" id="category-lead">正在整理这一类笔记的文章。</p>
          <div class="section-lab-actions">
            <a class="section-lab-primary" href="/notes/">返回笔记首页</a>
            <a href="/studio/notion/">前往导入</a>
          </div>
        </div>
        <figure class="section-lab-visual">
          <img src="/assets/home-notes.png" alt="Berlin2003 笔记分类视觉图">
          <figcaption class="section-lab-visual-note">
            <strong id="category-figure-title">札记分类</strong>
            <span id="category-figure-copy">把同一路线的记录单独收拢，阅读时不再打散。</span>
          </figcaption>
        </figure>
      </section>

      <section class="section-lab-panel">
        <p class="section-lab-label" id="category-label">分类文章</p>
        <h2 id="category-heading">文章列表</h2>
        <div id="category-list" class="section-lab-grid two" style="margin-top:18px;">
          <p style="color:var(--section-muted);margin:0;">加载中...</p>
        </div>
      </section>
    </main>

    <footer class="section-lab-footer">
      <span id="category-footer">笔记分类</span>
      <span>berlin2003.ccwu.cc</span>
    </footer>
  </div>

  <script src="/assets/notes-category.js"></script>
  <script src="/assets/site-chat.js"></script>
</body>
</html>
